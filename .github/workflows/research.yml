name: Overnight Research

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Nasdaq 100 / S&P 500 only (QQQ/SPY) -- crypto (BTCUSDT/ETHUSDT) was dropped
          # entirely on purpose: a pro trader's read was that splitting discovery compute
          # across asset classes with very different regimes was adding noise, not edge.
          # All freed-up budget goes to these two symbols, with 1-minute specifically
          # getting a much bigger candidate count now that it isn't competing with crypto.
          - source: stocks
            symbol: SPY
            interval: 15Min
            start: "2020-08-01"
            end: "2026-01-01"
            n_candidates: 800
          - source: stocks
            symbol: SPY
            interval: 1Hour
            start: "2020-08-01"
            end: "2026-01-01"
            n_candidates: 1500
          - source: stocks
            symbol: QQQ
            interval: 15Min
            start: "2020-08-01"
            end: "2026-01-01"
            n_candidates: 800
          - source: stocks
            symbol: QQQ
            interval: 1Hour
            start: "2020-08-01"
            end: "2026-01-01"
            n_candidates: 1500
          # 1-minute: the platform's main current focus -- bounded to the last ~2 years
          # (not the full history) to keep fetch + backtest tractable, but with a much
          # larger candidate budget than before now that it's not sharing the matrix
          # with crypto's 1-minute jobs.
          - source: stocks
            symbol: SPY
            interval: 1Min
            start: "2024-01-01"
            end: "2026-01-01"
            n_candidates: 600
          - source: stocks
            symbol: QQQ
            interval: 1Min
            start: "2024-01-01"
            end: "2026-01-01"
            n_candidates: 600
          # 5-minute: denser than 15-minute, so fewer candidates than the 15m combos above.
          - source: stocks
            symbol: SPY
            interval: 5Min
            start: "2020-08-01"
            end: "2026-01-01"
            n_candidates: 400
          - source: stocks
            symbol: QQQ
            interval: 5Min
            start: "2020-08-01"
            end: "2026-01-01"
            n_candidates: 400
          # 30-minute: between 15m and 1h in density.
          - source: stocks
            symbol: SPY
            interval: 30Min
            start: "2020-08-01"
            end: "2026-01-01"
            n_candidates: 1000
          - source: stocks
            symbol: QQQ
            interval: 30Min
            start: "2020-08-01"
            end: "2026-01-01"
            n_candidates: 1000
          # Daily: far fewer bars than any intraday interval, so it can afford many more
          # candidates per pass -- but note validate.py's sample-size scoring wants 100+
          # combined validation+test trades, which a daily rule may rarely reach.
          - source: stocks
            symbol: SPY
            interval: 1Day
            start: "2020-08-01"
            end: "2026-01-01"
            n_candidates: 2500
          - source: stocks
            symbol: QQQ
            interval: 1Day
            start: "2020-08-01"
            end: "2026-01-01"
            n_candidates: 2500
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: >
          python run_scheduled.py
          --source ${{ matrix.source }}
          --symbol ${{ matrix.symbol }}
          --interval ${{ matrix.interval }}
          --start ${{ matrix.start }}
          --end ${{ matrix.end }}
          --n-candidates ${{ matrix.n_candidates }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
