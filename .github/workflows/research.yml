name: Overnight Research

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # 15-minute timeframes have far more historical bars -> slower backtests,
          # so they get fewer discovery candidates to stay inside the time budget.
          - source: crypto
            symbol: BTCUSDT
            interval: 15m
            start: "2019-01-01"
            end: "2026-01-01"
            n_candidates: 400
          - source: crypto
            symbol: BTCUSDT
            interval: 1h
            start: "2019-01-01"
            end: "2026-01-01"
            n_candidates: 800
          - source: crypto
            symbol: ETHUSDT
            interval: 15m
            start: "2019-01-01"
            end: "2026-01-01"
            n_candidates: 400
          - source: crypto
            symbol: ETHUSDT
            interval: 1h
            start: "2019-01-01"
            end: "2026-01-01"
            n_candidates: 800
          - source: stocks
            symbol: SPY
            interval: 15Min
            start: "2020-08-01"
            end: "2026-01-01"
            n_candidates: 400
          - source: stocks
            symbol: SPY
            interval: 1Hour
            start: "2020-08-01"
            end: "2026-01-01"
            n_candidates: 800
          - source: stocks
            symbol: QQQ
            interval: 15Min
            start: "2020-08-01"
            end: "2026-01-01"
            n_candidates: 400
          - source: stocks
            symbol: QQQ
            interval: 1Hour
            start: "2020-08-01"
            end: "2026-01-01"
            n_candidates: 800
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: >
          python run_scheduled.py
          --source ${{ matrix.source }}
          --symbol ${{ matrix.symbol }}
          --interval ${{ matrix.interval }}
          --start ${{ matrix.start }}
          --end ${{ matrix.end }}
          --n-candidates ${{ matrix.n_candidates }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
