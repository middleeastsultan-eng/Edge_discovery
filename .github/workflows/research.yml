name: Overnight Research

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # 15-minute timeframes have far more historical bars -> slower backtests,
          # so they get fewer discovery candidates to stay inside the time budget.
          - source: crypto
            symbol: BTCUSDT
            interval: 15m
            start: "2019-01-01"
            end: "2026-01-01"
            n_candidates: 400
          - source: crypto
            symbol: BTCUSDT
            interval: 1h
            start: "2019-01-01"
            end: "2026-01-01"
            n_candidates: 800
          - source: crypto
            symbol: ETHUSDT
            interval: 15m
            start: "2019-01-01"
            end: "2026-01-01"
            n_candidates: 400
          - source: crypto
            symbol: ETHUSDT
            interval: 1h
            start: "2019-01-01"
            end: "2026-01-01"
            n_candidates: 800
          - source: stocks
            symbol: SPY
            interval: 15Min
            start: "2020-08-01"
            end: "2026-01-01"
            n_candidates: 400
          - source: stocks
            symbol: SPY
            interval: 1Hour
            start: "2020-08-01"
            end: "2026-01-01"
            n_candidates: 800
          - source: stocks
            symbol: QQQ
            interval: 15Min
            start: "2020-08-01"
            end: "2026-01-01"
            n_candidates: 400
          - source: stocks
            symbol: QQQ
            interval: 1Hour
            start: "2020-08-01"
            end: "2026-01-01"
            n_candidates: 800
          # 1-minute bars are ~15x denser than 15-minute -- bounded to the last ~2 years
          # (not the full history) to keep fetch + backtest tractable, with a much
          # smaller candidate count to stay inside the per-job time budget.
          - source: crypto
            symbol: BTCUSDT
            interval: 1m
            start: "2024-01-01"
            end: "2026-01-01"
            n_candidates: 100
          - source: crypto
            symbol: ETHUSDT
            interval: 1m
            start: "2024-01-01"
            end: "2026-01-01"
            n_candidates: 100
          - source: stocks
            symbol: SPY
            interval: 1Min
            start: "2024-01-01"
            end: "2026-01-01"
            n_candidates: 100
          - source: stocks
            symbol: QQQ
            interval: 1Min
            start: "2024-01-01"
            end: "2026-01-01"
            n_candidates: 100
          # 5-minute: denser than 15-minute, so fewer candidates than the 15m combos above.
          - source: crypto
            symbol: BTCUSDT
            interval: 5m
            start: "2019-01-01"
            end: "2026-01-01"
            n_candidates: 200
          - source: crypto
            symbol: ETHUSDT
            interval: 5m
            start: "2019-01-01"
            end: "2026-01-01"
            n_candidates: 200
          - source: stocks
            symbol: SPY
            interval: 5Min
            start: "2020-08-01"
            end: "2026-01-01"
            n_candidates: 200
          - source: stocks
            symbol: QQQ
            interval: 5Min
            start: "2020-08-01"
            end: "2026-01-01"
            n_candidates: 200
          # 30-minute: between 15m and 1h in density.
          - source: crypto
            symbol: BTCUSDT
            interval: 30m
            start: "2019-01-01"
            end: "2026-01-01"
            n_candidates: 500
          - source: crypto
            symbol: ETHUSDT
            interval: 30m
            start: "2019-01-01"
            end: "2026-01-01"
            n_candidates: 500
          - source: stocks
            symbol: SPY
            interval: 30Min
            start: "2020-08-01"
            end: "2026-01-01"
            n_candidates: 500
          - source: stocks
            symbol: QQQ
            interval: 30Min
            start: "2020-08-01"
            end: "2026-01-01"
            n_candidates: 500
          # Daily: far fewer bars than any intraday interval, so it can afford many more
          # candidates per pass -- but note validate.py's sample-size scoring wants 100+
          # combined validation+test trades, which a daily rule may rarely reach.
          - source: crypto
            symbol: BTCUSDT
            interval: 1d
            start: "2019-01-01"
            end: "2026-01-01"
            n_candidates: 2000
          - source: crypto
            symbol: ETHUSDT
            interval: 1d
            start: "2019-01-01"
            end: "2026-01-01"
            n_candidates: 2000
          - source: stocks
            symbol: SPY
            interval: 1Day
            start: "2020-08-01"
            end: "2026-01-01"
            n_candidates: 1500
          - source: stocks
            symbol: QQQ
            interval: 1Day
            start: "2020-08-01"
            end: "2026-01-01"
            n_candidates: 1500
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: >
          python run_scheduled.py
          --source ${{ matrix.source }}
          --symbol ${{ matrix.symbol }}
          --interval ${{ matrix.interval }}
          --start ${{ matrix.start }}
          --end ${{ matrix.end }}
          --n-candidates ${{ matrix.n_candidates }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
