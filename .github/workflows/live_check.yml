name: Live Signal Check

# Always-on, independent of whether the desktop GUI / local research loop is running.
# Cheap job -- no candidate search, just fetch recent bars and re-check patterns the
# research pipeline already proved -- so a tight schedule is affordable.
on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch: {}

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mirrors every symbol/interval combo research.yml can produce patterns for.
          - source: crypto
            symbol: BTCUSDT
            interval: 1m
          - source: crypto
            symbol: BTCUSDT
            interval: 5m
          - source: crypto
            symbol: BTCUSDT
            interval: 15m
          - source: crypto
            symbol: BTCUSDT
            interval: 30m
          - source: crypto
            symbol: BTCUSDT
            interval: 1h
          - source: crypto
            symbol: BTCUSDT
            interval: 4h
          - source: crypto
            symbol: BTCUSDT
            interval: 1d
          - source: crypto
            symbol: ETHUSDT
            interval: 1m
          - source: crypto
            symbol: ETHUSDT
            interval: 5m
          - source: crypto
            symbol: ETHUSDT
            interval: 15m
          - source: crypto
            symbol: ETHUSDT
            interval: 30m
          - source: crypto
            symbol: ETHUSDT
            interval: 1h
          - source: crypto
            symbol: ETHUSDT
            interval: 4h
          - source: crypto
            symbol: ETHUSDT
            interval: 1d
          - source: stocks
            symbol: SPY
            interval: 1Min
          - source: stocks
            symbol: SPY
            interval: 5Min
          - source: stocks
            symbol: SPY
            interval: 15Min
          - source: stocks
            symbol: SPY
            interval: 30Min
          - source: stocks
            symbol: SPY
            interval: 1Hour
          - source: stocks
            symbol: SPY
            interval: 1Day
          - source: stocks
            symbol: QQQ
            interval: 1Min
          - source: stocks
            symbol: QQQ
            interval: 5Min
          - source: stocks
            symbol: QQQ
            interval: 15Min
          - source: stocks
            symbol: QQQ
            interval: 30Min
          - source: stocks
            symbol: QQQ
            interval: 1Hour
          - source: stocks
            symbol: QQQ
            interval: 1Day
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: >
          python run_live_check.py
          --source ${{ matrix.source }}
          --symbol ${{ matrix.symbol }}
          --interval ${{ matrix.interval }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
